# A separate Compose project: never run this against the legacy "deploy" project.
name: merv-typescript
services:
  control:
    image: ${MERV_TS_IMAGE:?Set the immutable TypeScript release image}
    restart: unless-stopped
    init: true
    environment:
      # The served UI, which deploy/release.mjs and deploy/ui-release.mjs write on the VM.
      MERV_UI_ASSETS: /ui/
    env_file:
      - /etc/merv/typescript.env
      - path: /etc/sandboxes/shared.env
        format: raw
      # MERV_RELEASE, which deploy/release.mjs writes beside this file in each release.
      - path: release.env
        required: false
    ports:
      - 127.0.0.1:3081:3081
    volumes:
      # Code's repositories live here, under code/, beside the database and the blobs. One
      # server writes to this volume at a time, which Code enforces with a lock of its own.
      - /var/lib/merv-ts:/var/lib/merv-ts
      - sandboxes_data:/data
      - /var/lib/merv-ts-ui:/ui:ro
    networks:
      - legacy_database
      - sandboxes
      - metrics
    read_only: true
    tmpfs:
      # Chromium uses /tmp for shared image buffers (--disable-dev-shm-usage).
      # Large reference images stall with 64 MiB; 60 MP scans need a 1 GiB cap.
      # Git children of the server read and write under the data volume, never here.
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  # Metrics (packages/metrics): Main proxies /trackio here. It idles until /etc/merv/trackio.env
  # holds TRACKIO_WRITE_TOKEN, the only secret it is given; deploy/release.mjs builds its image
  # while the previous Main still serves.
  trackio:
    image: merv-typescript-trackio:0.43.0
    build:
      context: ../packages/metrics/trackio
    restart: unless-stopped
    init: true
    env_file:
      - path: /etc/merv/trackio.env
        required: false
    environment:
      TRACKIO_DIR: /data/trackio
    volumes:
      - trackio_data:/data/trackio
    networks: [metrics]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  metrics:
    internal: true
  legacy_database:
    external: true
    name: deploy_default
  sandboxes:
    external: true
    name: sandboxes_default
volumes:
  trackio_data:
  sandboxes_data:
    external: true
    name: sandboxes_sandboxes-data
