        "analogy": {
          "icon": "🪪",

        },
        "why": [
          "Merv must know **who** is calling before anyone can decide what they may do.",
          "People sign in through Supabase, an outside sign-in service. Identity checks that the sign-in **token** really came from Supabase.",
          "Agents and services use access keys. Identity keeps **one shared list** of them, storing only a fingerprint of each key, never the key itself."
        ],
        "neighbors": [
          {
            "id": "person",
            "name": "Person",
            "kind": "person",
            "dir": "in",
            "says": "brings a sign-in token",
            "detail": "A person signs in with Supabase in the browser, then sends the token with each request.",
            "page": null
          },
          {
            "id": "api",
            "name": "API",
            "dir": "in",
            "says": "asks who this caller is",
            "detail": "For each browser request, the API asks Identity to check the token and name the person."
          },
          {
            "id": "supabase",
            "name": "Supabase",
            "kind": "outside",
            "dir": "out",
            "says": "provides its public keys",

          },
          {
            "id": "scope",
            "name": "Scope",
            "dir": "in",
            "says": "uses the key list",

          {
            "id": "sessions",
            "name": "Sessions",
            "dir": "in",
            "says": "uses the key list",
            "detail": "Sessions issues keys for agent sessions and runners in the same list."
          },
          {
            "id": "pi",
            "name": "Pi",
            "dir": "in",
            "says": "uses the key list",
            "detail": "Pi records the keys of its workers in the same list."

          {
            "id": "state",
            "name": "State",
            "dir": "out",

          }

          "title": "Proving who you are",
          "steps": [
            {
              "from": "person",
              "to": "supabase",
              "text": "A person signs in with **Supabase** and gets a signed token: a digital pass."
            },
            {
              "from": "person",
              "to": "api",
              "text": "The browser sends that token with every request to Merv's API."

              "from": "api",
              "to": "scope",
              "text": "Scope then decides what this person is allowed to do."
