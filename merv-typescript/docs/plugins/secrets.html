  </head>
  <body>
    <script id="page" type="application/json">
      {
        "id": "secrets",
        "name": "Secrets",
        "group": "foundation",
        "tagline": "Locks away each person's Hugging Face token and lets agents download through it safely.",
        "analogy": {
          "icon": "🔐",
          "text": "A hotel safe with a concierge. You lock your library card in the safe once. Guests you invited can ask the concierge to borrow books for them, but they never get to hold your card."
        },
        "why": [
          "Agents often download AI models and datasets from **Hugging Face**, a website that hosts them. Private ones need a person's token, a password-like key.",
          "Giving that token to an agent is risky, because the agent could copy it. Secrets keeps it **encrypted** and never hands it back out.",
          "Instead, agents download through Secrets' **broker**, which adds the token on the way, only after Sessions says the agent is still allowed."
        ],
        "neighbors": [
          {
            "id": "person",
            "name": "Person",
            "kind": "person",
            "dir": "in",
            "says": "saves the token once",
            "detail": "In Settings, a person types the token into a hidden box. It can be replaced or removed, but never shown again.",
            "page": null
          },
          {
            "id": "worker",
            "name": "Worker agent",
            "kind": "person",
            "dir": "in",
            "says": "downloads through the broker",
            "detail": "A worker agent's download tools point at Merv's broker instead of straight at Hugging Face.",
            "page": null
          },
          {
            "id": "sessions",
            "name": "Sessions",
            "dir": "in",
            "says": "approves each download",
            "detail": "For every request, Sessions checks the agent's session is still live and allowed."
          },
          {
            "id": "api",
            "name": "API",
            "dir": "out",
            "says": "hosts its settings and broker",
            "detail": "Secrets adds its settings page and its download broker to Merv's API."
          },
          {
            "id": "state",
            "name": "State",
            "dir": "out",
            "says": "stores the scrambled token",
            "detail": "The database only ever holds the encrypted token, never the real one."
          },
          {
            "id": "huggingface",
            "name": "Hugging Face",
            "kind": "outside",
            "dir": "out",
            "says": "receives allowed downloads",
            "detail": "Secrets forwards read-only requests with the person's token added. Uploads and account changes are refused.",
            "page": null
          }
        ],
        "story": {
          "title": "An agent downloads a private model",
          "steps": [
            {
              "from": "person",
              "to": "self",
              "text": "A person saves their Hugging Face token once in Settings. Secrets scrambles it with a secret key."
            },
            {
              "from": "self",
              "to": "state",
              "text": "Only the scrambled version is saved in the database."
            },
            {
              "from": "worker",
              "to": "self",
              "text": "Later, a worker agent starts a download. It holds a short-lived **pass** tied to its session, not the real token."
            },
            {
              "from": "self",
              "to": "sessions",
              "text": "Secrets asks Sessions: is this session still running and allowed?"
            },
            { "from": "sessions", "to": "self", "text": "Sessions checks and says yes." },
            {
              "from": "self",
              "to": "huggingface",
              "text": "Secrets unscrambles the token, adds it to the request and passes it on. Only reading is allowed."
            },
            {
              "from": "huggingface",
              "to": "worker",
              "text": "The model streams back to the agent, which never saw the token. Once the session ends, its next request is refused."
            }
          ]
        },
        "words": [
          { "term": "Token", "meaning": "A password-like key that lets someone use an account." },
          {
            "term": "Encryption",
            "meaning": "Scrambling data so only someone with the secret key can read it."
          },
          {
            "term": "Broker",
            "meaning": "A middleman that makes requests for you and adds the token on the way."
          },
          {
            "term": "Pass",
            "meaning": "A short-lived permission tied to one agent session. It contains no token."
          }
        ],
        "not": [
          "It doesn't decide whether an agent's session is allowed. **Sessions** checks that on every request.",
          "It doesn't deliver private settings to agent computers. **Runner** handles that."
        ],
        "readme": "../../packages/secrets/README.md"
      }
    </script>
    <script src="explainer.js"></script>
  </body>
