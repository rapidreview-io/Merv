          "icon": "📬",
          "text": "A newspaper subscription with a bookmark. Each subscriber gets every issue in order, and the bookmark shows where they stopped. If one reader is ill, their pile waits for them, and nobody else's delivery stops."

          "When something happens, like a session closing, several plugins must react. Calling each one directly would tangle them together.",

        "neighbors": [
          {
            "id": "state",

            "dir": "out",
            "says": "reads the event log",

          {
            "id": "sessions",
            "name": "Sessions",
            "dir": "in",
            "says": "announces closed sessions",

          {
            "id": "workflows",
            "name": "Workflows",
            "dir": "in",
            "says": "announces each step",

          {
            "id": "scope",
            "name": "Scope",
            "dir": "in",

          {
            "id": "sandboxes",
            "name": "Sandboxes",

          {
            "id": "tasks",
            "name": "Tasks",

            "dir": "out",
            "says": "hears when sessions close",

              "to": "self",
              "text": "State wakes Domain Events: there is something new in the log."

            {
              "from": "self",

              "to": "sandboxes",

          {
