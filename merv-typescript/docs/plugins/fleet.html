        },
        "why": [
          "Rented computers cost money. Fleet sets **limits** for the whole system and for each project.",

          "Agents on rented machines shouldn't hold the AI model's secret key. Fleet keeps the key and passes their calls along."

        "neighbors": [
          {
            "id": "person",
            "name": "Person",
            "kind": "person",
            "dir": "in",
            "says": "watches, drains or halts",
            "detail": "On the Fleet page a person sees the machines and can drain them (start no new ones) or halt them.",
            "page": null
          },
          {
            "id": "sessions",
            "name": "Sessions",
            "dir": "out",
            "says": "learns what work waits",
            "detail": "Fleet asks Sessions which steps are waiting for a hosted worker, and which session a machine is holding."
          },
          {
            "id": "sandboxes",
            "name": "Sandboxes",
            "dir": "out",
            "says": "rents the machines",
