# Merv research control. merv-sandboxes owns ML compute and large workload data.
# Add docker-compose.postgres.yml or docker-compose.supabase.yml for records.
services:
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      MERV_MODE: control
      MERV_HTTP_HOST: 0.0.0.0
      MERV_HTTP_PORT: 8787
      # Browser origins allowed by CORS: the hosted UI (Vercel) + the control
      # plane's own host + local dev. Override with MERV_ALLOWED_ORIGINS
      # in the environment if a deployment needs a different set.
      MERV_ALLOWED_ORIGINS: ${MERV_ALLOWED_ORIGINS:-${RESEARCH_PLUGIN_ALLOWED_ORIGINS:-https://experiments.rapidreview.io,https://research-suite-chi.vercel.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}}
      # UI base for hosted OAuth consent; may carry a path (/merv).
      MERV_UI_BASE_URL: ${MERV_UI_BASE_URL:-${RESEARCH_PLUGIN_UI_BASE_URL:-}}
      # End-user auth against the shared RapidReview Supabase project. Hosted
      # control refuses to boot without a verifier, and this stack publishes
      # 8787 below, so the four values are required. A record-only dev stack
      # that deliberately wants an OPEN plane sets MERV_REQUIRE_AUTH=0 and
      # MERV_ALLOW_OPEN_CONTROL=1 instead.
      MERV_REQUIRE_AUTH: ${MERV_REQUIRE_AUTH:-1}
      MERV_ALLOW_OPEN_CONTROL: ${MERV_ALLOW_OPEN_CONTROL:-0}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      # Record store: supplied by a database overlay or by the operator. An
      # empty value fails hosted startup with a named MERV_DB_URL error.
      MERV_DB_URL: ${MERV_DB_URL:-}
      # Merv owns research evidence in a dedicated R2 bucket.
      MERV_BLOB_BUCKET: ${MERV_BLOB_BUCKET:?set MERV_BLOB_BUCKET}
      MERV_BLOB_ENDPOINT_URL: ${MERV_BLOB_ENDPOINT_URL:?set MERV_BLOB_ENDPOINT_URL}
      MERV_BLOB_ACCESS_KEY_ID: ${MERV_BLOB_ACCESS_KEY_ID:?set MERV_BLOB_ACCESS_KEY_ID}
      MERV_BLOB_SECRET_ACCESS_KEY: ${MERV_BLOB_SECRET_ACCESS_KEY:?set MERV_BLOB_SECRET_ACCESS_KEY}
      MERV_BLOB_REGION: ${MERV_BLOB_REGION:-auto}
      MERV_BLOB_PREFIX: ${MERV_BLOB_PREFIX:-}
      # Cloud provider keys, SSH authorities, datasets and models belong to
      # the independently deployed merv-sandboxes service.
      MERV_SANDBOXES_URL: ${MERV_SANDBOXES_URL:?set MERV_SANDBOXES_URL}
      MERV_SANDBOXES_JWT_SECRET: ${MERV_SANDBOXES_JWT_SECRET:?set MERV_SANDBOXES_JWT_SECRET}
      MERV_REQUIRE_SANDBOX_BACKEND: ${MERV_REQUIRE_SANDBOX_BACKEND:-1}
      MERV_STORAGE_MAX_UPLOAD_BYTES: ${MERV_STORAGE_MAX_UPLOAD_BYTES:-53687091200}
      MERV_OAUTH_RESOURCE_URI: ${MERV_OAUTH_RESOURCE_URI:-}
      MERV_WAIT_SECRET: ${MERV_WAIT_SECRET:?set a stable MERV_WAIT_SECRET}
    ports:
      - "8787:8787"
