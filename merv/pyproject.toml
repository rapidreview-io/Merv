[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merv"
version = "0.0015"
description = "Lean research-state workflow with hosted MCP research state, typed artifacts, reviews, and cloud SSH sandboxes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RapidReview" }]
keywords = ["research", "ml", "mcp", "experiments"]
# HTTP clients and service authentication are shared by both deployment modes.
dependencies = [
    "boto3>=1.36,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyJWT>=2.10,<3",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# Compute and large-object transfers belong to merv-sandboxes; Merv uses R2
# directly for its own artifacts, figures, feed bytes, and diagnostic payloads.
local = []
control = ["psycopg[binary]>=3.1,<4", "psycopg-pool>=3.1,<4"]
[project.scripts]
merv-http = "merv.brain.surface.transport.http_server:main"
merv-control = "merv.brain.surface.transport.http_server:control_main"
merv-client = "merv.client.cli:main"
merv-agent-runner = "merv.client.agent_runner:main"

[tool.pytest.ini_options]
# The shipped packages live under src/ (src-layout); tests import them from
# there without an editable install.
pythonpath = ["src"]

[tool.setuptools.packages.find]
# src-layout: discover merv AND its subpackages (merv.brain.research_core,
# merv.brain.infrastructure.*, …). A previous explicit package list shipped
# only the top-level dirs, so an installed wheel (the control image) could not
# import the subpackages — source-checkout tests never caught it because they
# run from a copytree, not the wheel. ``find`` over src/ keeps the wheel and
# the checkout in sync.
where = ["src"]
