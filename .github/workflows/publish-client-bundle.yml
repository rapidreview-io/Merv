name: Publish client plugins

on:
  push:
    tags: ['clients-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-merv-plugins
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_PUBLISH_CREDENTIAL: ${{ secrets.MERV_PLUGINS_PUBLISH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test exporter contract
        run: python3 -m unittest discover -s tools -p 'test_export_plugins.py'

      - name: Export committed plugins (no application build)
        shell: bash
        run: |
          set -euo pipefail
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/clients-v* ]]; then
            version_args=(--version "${GITHUB_REF_NAME#clients-v}")
          fi
          python3 tools/export_plugins.py --revision "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/merv-plugins" "${version_args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: merv-plugins
          path: ${{ runner.temp }}/merv-plugins
          include-hidden-files: true

      - name: Check out dedicated public destination
        if: env.HAS_PUBLISH_CREDENTIAL == 'true'
        uses: actions/checkout@v4
        with:
          repository: rapidreview-io/merv-plugins
          ref: main
          path: plugin-destination
          token: ${{ secrets.MERV_PLUGINS_PUBLISH_TOKEN }}

      - name: Publish only exported plugin files
        if: env.HAS_PUBLISH_CREDENTIAL == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git/ "$RUNNER_TEMP/merv-plugins/" plugin-destination/
          cd plugin-destination
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish plugins from ${GITHUB_SHA}"
          git push origin HEAD:main

      - name: Publication setup required
        if: env.HAS_PUBLISH_CREDENTIAL != 'true'
        run: echo 'Export verified and uploaded. Publication skipped; configure MERV_PLUGINS_PUBLISH_TOKEN or publish the artifact using local gh authentication.' >> "$GITHUB_STEP_SUMMARY"
