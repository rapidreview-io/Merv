name: Publish runner bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-merv-runner
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone runner
        run: python3 merv/scripts/build_runner_bundle.py --out "$RUNNER_TEMP/merv-runner"

      - name: Verify runner bundle
        working-directory: merv
        env:
          PYTHONPATH: src
        run: python3 -m unittest tests.surface.test_runner_bundle tests.state.test_agent_runner

      - name: Publish generated merv-runner branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/merv-runner-publish"
          mkdir -p "$publish_dir"
          cp -R "$RUNNER_TEMP/merv-runner/." "$publish_dir/"
          cd "$publish_dir"
          git init
          git checkout -b merv-runner
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish Merv runner from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin merv-runner
